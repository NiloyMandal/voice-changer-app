[project]
name = "voice-changer-app"
version = "0.1.0"
description = "Low-latency live voice changer prototype with FastAPI WebSocket streaming"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"numpy>=1.26",
	"scipy>=1.13",
	"librosa>=0.10.2",
	"sounddevice>=0.4.7",
	"pydantic>=2.7",
	"pydantic-settings>=2.2",
	"loguru>=0.7",
	"torch>=2.3",
	"onnxruntime>=1.18",
	"fastapi>=0.112",
	"uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.2",
	"httpx>=0.27",
	"ruff>=0.6.9",
	"black>=24.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
